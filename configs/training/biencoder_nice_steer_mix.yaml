experiment:
  name: biencoder_nice_steer_mix
  output_root: outputs/runs

training:
  base_model: models/SKILLRET-Embedding-0.6B
  output_dir: outputs/models/biencoder_nice_steer_mix
  max_seq_length: 512
  epochs: 1
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.00002
  warmup_ratio: 0.1
  bf16: true
  fp16: false
  eval_steps: 100
  save_steps: 100
  logging_steps: 20
  report_to: none
  query_prompt: "Instruct: Given a skill search query, retrieve relevant skills that match the query\nQuery: "
